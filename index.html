            border-color: var(--btn-bg-active);

            border-radius: 40px;

            font-size: 0.8rem;
            cursor: pointer;

            right: 12px;
            background: none;
            border: none;
            font-size: 1.25rem;

            font-size: 1.1rem;
            color: var(--text-primary);

            color: var(--text-secondary);

            border-radius: 20px;

        }
        .term-card {
            background: var(--term-card-bg);
            border-radius: 20px;
            padding: 10px 14px;
            border-left: 5px solid var(--term-border);
        }
        .term-title {

            font-size: 1rem;
            color: var(--text-primary);
        }
        .term-def {
            font-size: 0.85rem;
            color: var(--text-secondary);

            padding: 16px;

            }

                padding: 8px 10px;

</head>

    // ================== FUNCIONES AUXILIARES ==================
    function saveChecklist(key, checks) { localStorage.setItem(key, JSON.stringify(checks)); }
    function loadChecklist(key) { const saved = localStorage.getItem(key); return saved ? JSON.parse(saved) : null; }
    function bindChecklist(containerId, key) {
        const container = document.getElementById(containerId);
        if (!container) return;
        const checkboxes = container.querySelectorAll('.checklist-item input');
        const saved = loadChecklist(key);
        if (saved) checkboxes.forEach((cb, i) => { if (saved[i] !== undefined) cb.checked = saved[i]; });
        const update = () => {
            const states = Array.from(checkboxes).map(cb => cb.checked);
            saveChecklist(key, states);
            const total = checkboxes.length;
            const comp = states.filter(s => s).length;
            const span = container.querySelector('#progressCounter');
            if (span) span.innerText = `${comp}/${total}`;
        };
        checkboxes.forEach(cb => cb.addEventListener('change', update));
        const resetBtn = container.querySelector('[data-reset]');
        if (resetBtn) resetBtn.addEventListener('click', () => { checkboxes.forEach(cb => cb.checked = false); update(); });
        update();
    }

    function initDarkMode() {
        const dark = localStorage.getItem('darkMode') === 'true';
        if (dark) { document.body.classList.add('dark'); document.getElementById('darkModeToggle').innerText = '☀️'; }
        else { document.body.classList.remove('dark'); document.getElementById('darkModeToggle').innerText = '🌙'; }
    }
    function toggleDarkMode() {
        const isDark = document.body.classList.toggle('dark');
        localStorage.setItem('darkMode', isDark);
        document.getElementById('darkModeToggle').innerText = isDark ? '☀️' : '🌙';
    }

    function setFraseAnimo() {
        const bar = document.getElementById('motivationBar');
        if (!bar) return;
        let bag;
        try { bag = JSON.parse(localStorage.getItem('fraseBag')); } catch (e) { bag = null; }
        let last = parseInt(localStorage.getItem('lastFrase'), 10);
        if (isNaN(last)) last = -1;
        if (!Array.isArray(bag) || bag.length === 0) {
            // Rellenar la "bolsa" con todas las frases y mezclarla
            bag = frasesAnimo.map((_, idx) => idx);
            for (let j = bag.length - 1; j > 0; j--) {
                const r = Math.floor(Math.random() * (j + 1));
                [bag[j], bag[r]] = [bag[r], bag[j]];
            }
            // Evitar que la primera del nuevo ciclo sea igual a la última mostrada
            if (bag.length > 1 && bag[0] === last) { [bag[0], bag[1]] = [bag[1], bag[0]]; }
        }
        const i = bag.shift();
        localStorage.setItem('fraseBag', JSON.stringify(bag));
        localStorage.setItem('lastFrase', String(i));
        bar.textContent = frasesAnimo[i];
    }

    // ================== FAVORITOS ==================
    function loadFavs() { try { return JSON.parse(localStorage.getItem('favoritos') || '{}'); } catch (e) { return {}; } }
    function saveFavs(f) { localStorage.setItem('favoritos', JSON.stringify(f)); }
    function updateFavCount() {
        const n = Object.keys(loadFavs()).length;
        const btn = document.querySelector('[data-tab="favoritos"]');
        if (btn) btn.textContent = n ? `⭐ Favoritos (${n})` : '⭐ Favoritos';
    }
    function decorateFavorites() {
        const favs = loadFavs();
        document.querySelectorAll('#mainContent .card-item, #mainContent .term-card').forEach(card => {
            if (card.querySelector('.fav-star')) return;
            const titleEl = card.querySelector('.item-name, .term-title');
            if (!titleEl) return;
            const id = titleEl.textContent.trim();
            if (!id) return;
            const cleanHtml = card.outerHTML;
            const star = document.createElement('button');
            star.type = 'button';
            star.className = 'fav-star' + (favs[id] ? ' active' : '');
            star.textContent = '⭐';
            star.title = 'Guardar en favoritos';
            star.addEventListener('click', (e) => {
                e.stopPropagation();
                const f = loadFavs();
                if (f[id]) { delete f[id]; star.classList.remove('active'); if (currentTab === 'favoritos') card.remove(); }
                else { f[id] = cleanHtml; star.classList.add('active'); }
                saveFavs(f);
                updateFavCount();
            });
            card.appendChild(star);
        });
    }
    function renderFavoritos() {
        const container = document.getElementById('mainContent');
        const favs = loadFavs();
        const ids = Object.keys(favs);
        if (!ids.length) {
            container.innerHTML = `<div class="service-title">⭐ Favoritos</div><div class="service-desc">Aún no tienes favoritos. Toca la ⭐ en cualquier tarjeta para guardarla aquí y tenerla a mano.</div>`;
            return;
        }
        container.innerHTML = `<div class="service-title">⭐ Favoritos (${ids.length})</div><div class="service-desc">Tus tarjetas guardadas. Toca la ⭐ para quitarlas.</div><div class="grid-cards">${ids.map(id => favs[id]).join("")}</div>`;
    }

    // ================== NAVEGACIÓN PRINCIPAL ==================
    let currentTab = 'productosMar';
    function setMainTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.main-btn').forEach(btn => {
            if (btn.getAttribute('data-tab') === tab) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        if (tab === 'protocolos') renderProtocolos();
        else if (tab === 'atencionMesa') renderAtencionMesa();
        else if (tab === 'bebestibles') renderBebestibles();
        else if (tab === 'maridajes') renderMaridajes();
        else if (tab === 'carnes') renderCarnes();
        else if (tab === 'productosMar') renderProductosMar();
        else if (tab === 'vegetales') renderVegetales();
        else if (tab === 'restaurantes') renderRestaurantesChile();
        else if (tab === 'diccionario') renderDiccionario();
        else if (tab === 'favoritos') renderFavoritos();
        decorateFavorites();
        window.scrollTo(0, 0);
    }

    // ================== PWA (instalación + offline) ==================
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        const ib = document.getElementById('installBtn');
        if (ib) ib.hidden = false;
    });
    window.addEventListener('appinstalled', () => {
        const ib = document.getElementById('installBtn');
        if (ib) ib.hidden = true;
        deferredPrompt = null;
    });

    document.addEventListener('DOMContentLoaded', () => {
        initDarkMode();
        updateFavCount();
        setFraseAnimo();
        document.getElementById('motivationBar').addEventListener('click', setFraseAnimo);
        document.getElementById('darkModeToggle').addEventListener('click', toggleDarkMode);
        document.querySelectorAll('.main-btn').forEach(btn => {
            btn.addEventListener('click', () => setMainTab(btn.getAttribute('data-tab')));
        });
        const installBtn = document.getElementById('installBtn');
        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            await deferredPrompt.userChoice;
            deferredPrompt = null;
            installBtn.hidden = true;
        });
        setMainTab('productosMar');
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
        }
    });
</script>
